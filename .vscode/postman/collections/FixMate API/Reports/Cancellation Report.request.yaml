$kind: http-request
url: http://127.0.0.1:5050/api/v1.0/reports/cancellations
method: GET
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response is valid JSON\", function () {\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      pm.test(\"Response contains data array\", function () {\r

      \    const json = pm.response.json();\r

      \    pm.expect(json.data).to.be.an(\"array\");\r

      });\r

      \r

      pm.test(\"Report count matches data\", function () {\r

      \    const json = pm.response.json();\r

      \    pm.expect(json.count).to.eql(json.data.length);\r

      });\r

      \r

      pm.test(\"Response time is under 2000ms\", function () {\r

      \    pm.expect(pm.response.responseTime).to.be.below(2000);\r

      });\r\n"
    language: text/javascript
order: 4000
