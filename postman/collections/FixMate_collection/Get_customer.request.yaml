scripts:
  - type: afterResponse
    code: "pm.test(\"Status is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Returns customer CUST002\", function () {\r

      \    const body = pm.response.json();\r

      \    pm.expect(body.data._id).to.eql(\"CUST002\");\r

      });\r

      \r

      pm.test(\"Includes nested property data\", function () {\r

      \    const customer = pm.response.json().data;\r

      \    pm.expect(customer.properties.length).to.be.above(0);\r

      \    pm.expect(customer.properties[0].rooms.length).to.be.above(0);\r

      \    pm.expect(customer.properties[0].rooms[0].assets).to.be.an(\"array\");\r

      });"
