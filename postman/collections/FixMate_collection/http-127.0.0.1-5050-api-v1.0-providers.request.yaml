$kind: http-request
name: http://127.0.0.1:5050/api/v1.0/providers
description: ""
url: http://127.0.0.1:5050/api/v1.0/service-categories
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Returns 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Returns the requested provider\", function () {\r

      \    const provider = pm.response.json().data;\r

      \r

      \    pm.expect(provider).to.be.an(\"object\");\r

      \    pm.expect(provider._id).to.equal(\"PROV001\");\r

      \    pm.expect(provider.businessName).to.be.a(\"string\");\r

      });\r

      \r

      pm.test(\"Contains nested services and tasks\", function () {\r

      \    const provider = pm.response.json().data;\r

      \r

      \    pm.expect(provider.services).to.be.an(\"array\").that.is.not.empty;\r

      \r

      \    provider.services.forEach(function (service) {\r

      \        pm.expect(service.serviceId).to.be.a(\"string\");\r

      \        pm.expect(service.tasks).to.be.an(\"array\").that.is.not.empty;\r

      \    });\r

      });\r

      \r

      pm.test(\"Does not expose email\", function () {\r

      \    pm.expect(pm.response.json().data)\r

      \        .not.to.have.property(\"email\");\r

      });\r

      \r

      pm.test(\"Returns 404 for a nonexistent provider\", function () {\r

      \    pm.response.to.have.status(404);\r

      });\r

      \r

      pm.test(\"Returns a clear error message\", function () {\r

      \    pm.expect(pm.response.json().error)\r

      \        .to.equal(\"Provider not found\");\r

      });"
    language: text/javascript
order: 1000
